<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reset your password — harrys</title>
<style>
  :root {
    --navy: #2B2622;
    --coral: #C97D5D;
    --coral-dark: #B5674A;
    --cream: #FBF6EF;
    --cream-dark: #F3EAD9;
    --text-primary: #2B2622;
    --text-secondary: #5C5248;
    --text-muted: #B08C7A;
    --border: #E4D6C4;
    --success: #6B8F71;
    --error: #C1584A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 1px 3px rgba(43,38,34,0.08);
  }
  .center { text-align: center; }
  .emoji { font-size: 48px; margin-bottom: 16px; }
  h1 {
    font-family: Georgia, serif;
    font-size: 22px;
    margin: 0 0 8px;
    text-align: center;
  }
  p.sub {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  p.body {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0;
    text-align: center;
  }
  form { display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; font-size: 15px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: #fff; color: var(--text-primary); font-family: inherit;
  }
  button[type="submit"] {
    background: var(--coral);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  button[type="submit"]:hover:not(:disabled) { background: var(--coral-dark); }
  #status {
    display: none;
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
  }
  #status.show { display: block; }
  #status.ok { background: #EAF2EB; color: var(--success); }
  #status.err { background: #F9E9E7; color: var(--error); }
  .brand {
    margin-top: 28px;
    font-family: Georgia, serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <!-- populated by script below depending on link validity / state -->
  </div>

<script>
  const SUPABASE_URL = 'https://nriqqzsabbatdnvbbtac.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yaXFxenNhYmJhdGRudmJidGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NTExNTIsImV4cCI6MjEwMzIyNzE1Mn0.l0937L1aHukO-W7Hgzt0HCIp05GLGoQwH4ceLU7159Q';

  const card = document.getElementById('card');

  function renderInvalid() {
    card.innerHTML = `
      <div class="center">
        <div class="emoji">⚠️</div>
        <h1>Link expired</h1>
        <p class="body">This password reset link is invalid or has expired. Go back to the harrys app and request a new one from the sign-in screen.</p>
      </div>
    `;
  }

  function renderSuccess() {
    card.innerHTML = `
      <div class="center">
        <div class="emoji">✅</div>
        <h1>Password reset</h1>
        <p class="body">Your password has been changed. Head back to the harrys app and sign in with your new password.</p>
        <div class="brand">🎯 harrys</div>
      </div>
    `;
  }

  function renderForm() {
    card.innerHTML = `
      <h1>Reset your password</h1>
      <p class="sub">Choose a new password for your harrys account.</p>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" required minlength="8" />
        </div>
        <button type="submit" id="submit-btn">Reset password</button>
        <div id="status"></div>
      </form>
    `;

    function setStatus(message, ok) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = 'show ' + (ok ? 'ok' : 'err');
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8) {
        setStatus('Password must be at least 8 characters.', false);
        return;
      }
      if (password !== confirm) {
        setStatus('Passwords don’t match.', false);
        return;
      }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${accessToken}`,
            apikey: ANON_KEY,
          },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || data.error || 'Something went wrong');
        renderSuccess();
      } catch (err) {
        setStatus(err instanceof Error ? err.message : 'Something went wrong', false);
        btn.disabled = false;
        btn.textContent = 'Reset password';
      }
    });
  }

  // Supabase sends the recovery session back in the URL fragment, e.g.
  // #access_token=...&type=recovery — never as a query string, since it must
  // never be sent to a server as part of the URL.
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const accessToken = hashParams.get('access_token');
  const type = hashParams.get('type');

  if (accessToken && type === 'recovery') {
    renderForm();
  } else {
    renderInvalid();
  }
</script>
</body>
</html>
