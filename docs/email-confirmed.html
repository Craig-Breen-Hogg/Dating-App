<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Email confirmed — harrys</title>
<style>
  :root {
    --navy: #2B2622;
    --coral: #C97D5D;
    --cream: #FBF6EF;
    --cream-dark: #F3EAD9;
    --text-primary: #2B2622;
    --text-secondary: #5C5248;
    --text-muted: #B08C7A;
    --border: #E4D6C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(43,38,34,0.08);
  }
  .emoji { font-size: 48px; margin-bottom: 16px; }
  h1 {
    font-family: Georgia, serif;
    font-size: 24px;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0;
  }
  .brand {
    margin-top: 32px;
    font-family: Georgia, serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h1>You're confirmed!</h1>
    <p>Your email address has been verified. Head back to the harrys app and sign in to finish setting up your profile.</p>
    <div class="brand">🎯 harrys</div>
  </div>
</body>
</html>
