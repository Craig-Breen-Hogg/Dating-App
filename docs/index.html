<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>harrys — Legal</title>
<style>
  :root {
    --navy: #2B2622;
    --coral: #C97D5D;
    --cream: #FBF6EF;
    --cream-dark: #F3EAD9;
    --text-primary: #2B2622;
    --text-secondary: #5C5248;
    --text-muted: #B08C7A;
    --border: #E4D6C4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--navy);
    padding: 60px 24px 32px;
    text-align: center;
  }
  header .brand {
    font-family: Georgia, serif;
    font-weight: 800;
    font-size: 28px;
    color: #fff;
  }
  header .tagline {
    color: var(--cream-dark);
    font-size: 14px;
    margin-top: 6px;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .card {
    display: block;
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text-primary);
    box-shadow: 0 1px 3px rgba(43,38,34,0.08);
    border: 1px solid var(--border);
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  .card p {
    margin: 0;
    font-size: 14px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <header>
    <div class="brand">🎯 harrys</div>
    <div class="tagline">Meet through doing.</div>
  </header>
  <main>
    <a class="card" href="./privacy.html">
      <h2>Privacy Policy</h2>
      <p>How we collect, use, and protect your information.</p>
    </a>
    <a class="card" href="./terms.html">
      <h2>Terms of Service</h2>
      <p>The rules for using harrys.</p>
    </a>
    <a class="card" href="./merchant.html">
      <h2>Partner with harrys</h2>
      <p>List your venue in the Venue Network.</p>
    </a>
  </main>
</body>
</html>
